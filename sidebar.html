<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formvelope</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="sidebar">
    <main>
      <h1>Formvelope</h1>
      <p>Cifra el contenido del área de texto enfocada usando tu clave pública configurada.</p>
      <button id="encrypt" type="button">Cifrar campo enfocado</button>
      <button id="encrypt-form" type="button">Cifrar campos multilínea del formulario</button>
      <label for="passphrase">Contraseña de la clave privada (si la sesión no está activa)</label>
      <input id="passphrase" type="password" autocomplete="off">
      <button id="decrypt" type="button">Descifrar campo enfocado</button>
      <button id="decrypt-page" type="button">Descifrar contenido cifrado de esta página</button>
      <p id="status" role="status" aria-live="polite"></p>
      <nav class="view-controls" aria-label="Configuración y vista">
        <a class="icon-button" href="options.html" target="_blank" aria-label="Configurar claves" title="Configurar claves">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 3 14 3.5l.5 2a7 7 0 0 1 1.5.9l2-.5 1.4 2.4-1.5 1.5a7 7 0 0 1 0 1.8l1.5 1.5-1.4 2.4-2-.5a7 7 0 0 1-1.5.9l-.5 2h-2l-.5-2a7 7 0 0 1-1.5-.9l-2 .5-1.4-2.4 1.5-1.5a7 7 0 0 1 0-1.8L6.6 8.3 8 5.9l2 .5a7 7 0 0 1 1.5-.9z"/>
            <circle cx="12" cy="12" r="2"/>
          </svg>
        </a>
        <button id="switch-view" class="icon-button" type="button" aria-label="Cambiar a ventana emergente" title="Cambiar a ventana emergente">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <rect x="5" y="3.5" width="14" height="17" rx="1.5"/>
            <path d="M8 7h8m-8 3h8m-8 3h5"/>
          </svg>
        </button>
      </nav>
    </main>
    <script src="build/popup.js"></script>
  </body>
</html>
